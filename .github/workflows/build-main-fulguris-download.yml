name: Manual Fulguris Download Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Slions download variants
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew assembleSlionsFullDownload

      - name: Show generated APK files
        if: always()
        run: |
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: Fulguris-Download-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
